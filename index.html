
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 75%, rgba(255,255,255,.7) 0 2px, transparent 3px),
        linear-gradient(135deg, #fcecef, #f8dce5, #f5e5df);

    background-size: auto, auto, cover;

    color: #674650;
    font-family: "Cormorant Garamond", Georgia, serif;
}

.wrapper {
    text-align: center;
    padding: 25px 16px;
}

.small-title {
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a06f7d;
    margin-bottom: 7px;
}

.main-title {
    font-family: "Playfair Display", serif;
    font-style: italic;
    font-size: 30px;
    font-weight: 500;
    color: #714957;
    margin: 0 0 25px;
}

/* CARD */

.scratch-card {
    position: relative;

    width: min(88vw, 390px);
    height: 260px;

    border-radius: 28px;
    overflow: hidden;

    background: #fffaf9;

    box-shadow:
        0 18px 50px rgba(111, 67, 82, .20),
        0 4px 10px rgba(111, 67, 82, .08);

    border: 1px solid rgba(255,255,255,.9);
}

/* HIDDEN MESSAGE */

.message {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 35px;

    text-align: center;

    font-size: 23px;
    line-height: 1.4;

    color: #674650;

    background: linear-gradient(
        135deg,
        #fffdfc,
        #fff4f6
    );
}

.hello {
    font-family: "Playfair Display", serif;
    font-style: italic;

    font-size: 30px;

    color: #8b5363;

    margin-bottom: 15px;
}

.final-line {
    margin-top: 15px;
    font-size: 21px;
}

/* SCRATCH CANVAS */

canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    touch-action: none;

    cursor: grab;
}

canvas:active {
    cursor: grabbing;
}

/* BELOW CARD */

.hint {
    margin-top: 19px;

    font-size: 17px;

    letter-spacing: .5px;

    color: #936372;
}

.sparkle {
    margin: 0 7px;
    font-size: 18px;
}

.reset {
    margin-top: 14px;

    border: 1px solid #e7c4ce;

    background: rgba(255,255,255,.65);

    border-radius: 22px;

    padding: 8px 18px;

    font-family: "Cormorant Garamond", serif;

    font-size: 16px;

    color: #8b5968;

    cursor: pointer;
}

.reset:hover {
    background: white;
}
</style>
</head>


<body>

<div class="wrapper">

    <div class="small-title">
        a little surprise for you
    </div>

    <h1 class="main-title">
        Something tiny, just for you ♡
    </h1>


    <div class="scratch-card">

        <!-- HIDDEN MESSAGE -->

        <div class="message">

            <div>

                <div class="hello">
                    Hi my cutu! ♡
                </div>

                Just a tiny little something to remind you<br>
                that someone is thinking of you.

                <div class="final-line">
                    I hope this made you smile ❤️
                </div>

            </div>

        </div>


        <!-- SCRATCH LAYER -->

        <canvas id="scratchCanvas"></canvas>

    </div>


    <div class="hint">

        <span class="sparkle">✦</span>
        scratch here
        <span class="sparkle">✦</span>

    </div>


    <button class="reset" onclick="resetCard()">
        scratch again ♡
    </button>

</div>


<script>

const canvas = document.getElementById("scratchCanvas");

const ctx = canvas.getContext("2d");

const card = canvas.parentElement;

let scratching = false;


/* SET CANVAS SIZE */

function resizeCanvas() {

    const rect = card.getBoundingClientRect();

    canvas.width = Math.round(rect.width);
    canvas.height = Math.round(rect.height);

    drawCover();
}


/* DRAW BEAUTIFUL SCRATCH LAYER */

function drawCover() {

    ctx.globalCompositeOperation = "source-over";


    /* Pink gradient */

    const gradient = ctx.createLinearGradient(
        0,
        0,
        canvas.width,
        canvas.height
    );

    gradient.addColorStop(0, "#d9acba");
    gradient.addColorStop(0.45, "#c995a7");
    gradient.addColorStop(1, "#e3c0ca");

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Soft texture */

    for (let i = 0; i < 350; i++) {

        ctx.fillStyle =
            "rgba(255,255,255," +
            (Math.random() * 0.10) +
            ")";

        ctx.beginPath();

        ctx.arc(
            Math.random() * canvas.width,
            Math.random() * canvas.height,
            Math.random() * 1.5,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* Main scratch text */

    ctx.fillStyle = "rgba(255,250,251,.98)";

    ctx.font =
        "600 23px 'Cormorant Garamond', Georgia, serif";

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";


    ctx.fillText(
        "✦  SCRATCH HERE  ✦",
        canvas.width / 2,
        canvas.height / 2 - 10
    );


    /* Small text */

    ctx.font =
        "16px 'Cormorant Garamond', Georgia, serif";

    ctx.fillText(
        "a little secret awaits ♡",
        canvas.width / 2,
        canvas.height / 2 + 24
    );
}


/* GET MOUSE / TOUCH POSITION */

function getPosition(event) {

    const rect = canvas.getBoundingClientRect();

    const point =
        event.touches
            ? event.touches[0]
            : event;

    return {

        x: point.clientX - rect.left,

        y: point.clientY - rect.top

    };
}


/* SCRATCH */

function scratch(event) {

    if (!scratching) return;

    event.preventDefault();

    const position = getPosition(event);


    ctx.globalCompositeOperation =
        "destination-out";


    ctx.beginPath();

    ctx.arc(
        position.x,
        position.y,
        25,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* MOUSE */

canvas.addEventListener(
    "mousedown",
    () => {
        scratching = true;
    }
);

window.addEventListener(
    "mouseup",
    () => {
        scratching = false;
    }
);

canvas.addEventListener(
    "mousemove",
    scratch
);


/* TOUCH */

canvas.addEventListener(
    "touchstart",
    event => {

        scratching = true;

        scratch(event);

    },
    { passive: false }
);

canvas.addEventListener(
    "touchmove",
    scratch,
    { passive: false }
);

window.addEventListener(
    "touchend",
    () => {
        scratching = false;
    }
);


/* RESET */

function resetCard() {

    drawCover();

}


/* START */

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();

</script>

</body>
</html>
